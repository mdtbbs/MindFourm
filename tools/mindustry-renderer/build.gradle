plugins {
    id 'java'
    id 'application'
}

group = 'cn.mdtbbs'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

application { mainClass = 'cn.mdtbbs.renderer.MapRenderer' }

tasks.register('rendererRegression', JavaExec) {
    dependsOn(tasks.named('testClasses'), tasks.named('copyMindustryAssets'))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.mdtbbs.renderer.RendererVisualRegression'
    environment 'ASSETS_ROOT', textureAssetsDir.absolutePath
    jvmArgs '-Djava.awt.headless=true'
}
tasks.named('test') { dependsOn(tasks.named('rendererRegression')) }

// Keep this runtime current: MapIO cannot read save formats introduced after
// the bundled Mindustry build.  The forum preview service must be able to
// render maps authored by the current official client.
// Keep renderer parsing and fixture verification reproducible across CI and local builds.
def mindustryVersion = 'v160.2'
def mindustryServerSha256 = 'fc686a6198419a91cbc1649f93f10cc54f8e1e65160313840c9aab7c2c78fe57'
def mindustryDesktopSha256 = '7f210295dfffb4c17b582b27bab41f4dde83f557f00f0877572fdac943f40539'
def mindustryJar = file("$buildDir/deps/server-release-${mindustryVersion}.jar")
def mindustryDesktopJar = file("$buildDir/deps/Mindustry-${mindustryVersion}.jar")
def textureAssetsDir = file("$buildDir/assets")

def verifySha256 = { File artifact, String expected ->
    def actual = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes)
        .collect { String.format('%02x', it) }.join()
    if (actual != expected) {
        throw new GradleException("SHA-256 mismatch for ${artifact.name}: expected ${expected}, got ${actual}")
    }
}

repositories { mavenCentral() }

tasks.register('downloadMindustry') {
    outputs.file(mindustryJar)
    doLast {
        if (!mindustryJar.parentFile.exists()) mindustryJar.parentFile.mkdirs()
        if (!mindustryJar.exists()) {
            new URL("https://github.com/Anuken/Mindustry/releases/download/${mindustryVersion}/server-release.jar").withInputStream { input ->
                mindustryJar.withOutputStream { output -> output << input }
            }
        }
        verifySha256(mindustryJar, mindustryServerSha256)
    }
}

// The server JAR parses resources; the desktop JAR supplies the official block sprites.
tasks.register('downloadMindustryDesktop') {
    outputs.file(mindustryDesktopJar)
    doLast {
        if (!mindustryDesktopJar.parentFile.exists()) mindustryDesktopJar.parentFile.mkdirs()
        if (!mindustryDesktopJar.exists()) {
            new URL("https://github.com/Anuken/Mindustry/releases/download/${mindustryVersion}/Mindustry.jar").withInputStream { input ->
                mindustryDesktopJar.withOutputStream { output -> output << input }
            }
        }
        verifySha256(mindustryDesktopJar, mindustryDesktopSha256)
    }
}

dependencies { implementation files(mindustryJar) }
tasks.compileJava.dependsOn(tasks.named('downloadMindustry'))

jar {
    archiveBaseName = 'mindfourm-mindustry-renderer'
    manifest { attributes('Main-Class': 'cn.mdtbbs.renderer.MapRenderer') }
}

tasks.register('copyMindustryRuntime', Copy) {
    from(mindustryJar)
    into(layout.buildDirectory.dir('libs'))
    rename { "mindustry-server-${mindustryVersion}.jar" }
    dependsOn(tasks.named('downloadMindustry'))
}

tasks.register('copyMindustryAssets', Copy) {
    from(zipTree(mindustryDesktopJar)) { include('sprites/**') }
    into(textureAssetsDir)
    dependsOn(tasks.named('downloadMindustryDesktop'))
}
