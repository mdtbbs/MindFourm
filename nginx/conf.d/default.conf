# ─────────────────────────────────────────────────────────────────────────────
# TLS and canonical host
#
# Both are required for the `alternates.canonical` metadata the app now emits to
# mean anything: with www and non-www, and http and https, all resolving, search
# engines see four URLs for every page and split ranking signals between them.
#
# This needs values only you can supply, so it ships commented out. To enable:
#   1. Replace forum.example.com with the real host in BOTH blocks below.
#   2. Put fullchain.pem / privkey.pem in ./nginx/ssl (mounted at /etc/nginx/ssl).
#   3. Uncomment both blocks and remove `listen 80` from the main server below.
#
# server {
#     listen 80;
#     server_name forum.example.com www.forum.example.com;
#     # ACME challenges must stay reachable over plain HTTP.
#     location /.well-known/acme-challenge/ { root /var/www/certbot; }
#     location / { return 301 https://forum.example.com$request_uri; }
# }
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name www.forum.example.com;
#     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
#     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
#     return 301 https://forum.example.com$request_uri;
# }
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # Sent on every response, including proxied ones. `always` matters: without it
    # nginx omits these on 4xx/5xx.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Enable together with the TLS blocks above — advertising HSTS while still
    # serving plain HTTP would lock clients out of a site that cannot answer.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Do not advertise the nginx patch version.
    server_tokens off;

    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
