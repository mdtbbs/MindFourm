name: One-shot forum version hotfix

on:
  push:
    branches: [fix/master-version-2.6.3]
    paths:
      - .github/workflows/version-hotfix.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v7
        with:
          ref: fix/master-version-2.6.3
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Bump forum patch version
        run: npm run version:patch

      - name: Commit version bump and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/version-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/version-hotfix.yml
          git commit -m "chore: bump forum version to 2.6.3"
          git push origin HEAD:fix/master-version-2.6.3
