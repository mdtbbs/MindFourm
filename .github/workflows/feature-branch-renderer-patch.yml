name: Feature branch renderer patch

on:
  push:
    branches:
      - feat/full-editors-mobile-ops-recommendations
    paths:
      - .github/workflows/feature-branch-renderer-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-editors-mobile-ops-recommendations
      - name: Apply focused renderer changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('tools/mindustry-renderer/src/main/java/cn/mdtbbs/renderer/MapRenderer.java')
          text = path.read_text()
          replacements = {
              'private static final int MAX_MAP_LAYER_ITEMS = 5_000;': 'private static final int MAX_MAP_LAYER_ITEMS = 40_000;',
              'private static final String VERSION = "v160.2-preview-6-editors";': 'private static final String VERSION = "v160.2-preview-7-full-editors";',
              ' || block.size != 1': '',
          }
          for before, after in replacements.items():
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'expected exactly one renderer fragment, got {count}: {before}')
              text = text.replace(before, after, 1)
          path.write_text(text)

          workflow = Path('.github/workflows/feature-branch-renderer-patch.yml')
          workflow.unlink()
      - name: Commit renderer patch
        run: |
          git config user.name "mdtbbs-ci"
          git config user.email "actions@users.noreply.github.com"
          git add tools/mindustry-renderer/src/main/java/cn/mdtbbs/renderer/MapRenderer.java .github/workflows/feature-branch-renderer-patch.yml
          git commit -m "feat(renderer): enable full schematic footprints and larger map layers"
          git push origin HEAD:feat/full-editors-mobile-ops-recommendations
