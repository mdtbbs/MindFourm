name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require changelog update for Public V1 contract changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-api-changelog.cjs

      - name: Check forum version increment on master pushes
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-version-increment.cjs "$BASE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Tiptap/backend contract suite loads the production editor extensions
      # through Jest aliases into frontend/src and frontend/node_modules.
      - name: Install frontend dependencies for editor contract tests
        working-directory: frontend
        run: npm ci

      - name: Build backend
        run: npm run build:backend

      - name: Run backend tests
        run: npm test -- --runInBand

      - name: Check committed Public V1 OpenAPI contract
        run: npm run openapi:check

      - name: Test Public V1 changelog guard
        run: npm run test:api-changelog

  production-image:
    name: Production Docker API docs smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production Docker image
        run: docker build --tag mindfourm-docs-smoke .

      - name: Verify runtime Markdown guides in the image
        run: |
          docker run --rm --entrypoint /bin/sh mindfourm-docs-smoke -ec '
            for guide in \
              first-party-v1.md \
              public-client-v1.md \
              rich-content-schema-v2.md \
              authentication.md \
              game-content-v1.md \
              resources-v1-contract.md \
              multiplayer-v1.md \
              cloud-saves-v1.md \
              changelog-v1.md \
              lifecycle-v1.md; do
              test -s "/app/docs/api/$guide" || {
                echo "Missing runtime API guide: /app/docs/api/$guide" >&2
                exit 1
              }
            done
          '

  frontend:
    name: Frontend lint, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Production build
        working-directory: frontend
        run: npm run build

  renderer:
    name: Mindustry renderer compile and fixture tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Download pinned Mindustry v160.5 artifacts
        shell: bash
        run: |
          mkdir -p tools/mindustry-renderer/build/deps
          curl --fail --location --retry 3 \
            https://github.com/Anuken/Mindustry/releases/download/v160.5/server-release.jar \
            --output tools/mindustry-renderer/build/deps/server-release-v160.5.jar
          curl --fail --location --retry 3 \
            https://github.com/Anuken/Mindustry/releases/download/v160.5/Mindustry.jar \
            --output tools/mindustry-renderer/build/deps/Mindustry-v160.5.jar

      - name: Compile renderer and run safe fixture tests
        run: bash tools/mindustry-renderer/test-renderer.sh

  android:
    name: Android auth tests and debug build
    # Pin the current hosted image generation because it provides the Android
    # command-line SDK at the documented path and avoids the next latest-image
    # migration changing the preinstalled toolchain underneath this job.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android API 35 and build tools
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses < <(yes)
          "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"

      - name: Run Android unit tests and assemble
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/android-gradle.log"
          result=${PIPESTATUS[0]}
          if [[ "$result" -ne 0 ]]; then
            excerpt="$(tail -n 50 "$RUNNER_TEMP/android-gradle.log")"
            excerpt="${excerpt//'%'/'%25'}"
            excerpt="${excerpt//$'\r'/'%0D'}"
            excerpt="${excerpt//$'\n'/'%0A'}"
            printf '::notice file=.github/workflows/ci.yml,line=1::%s\n' "$excerpt"
            {
              echo "### Android Gradle failure output"
              tail -n 100 "$RUNNER_TEMP/android-gradle.log"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
