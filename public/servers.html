<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindustry 服务器申请</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .card h2 {
      margin-bottom: 16px;
      font-size: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #aaa;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 14px;
    }
    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
    }
    .btn-primary {
      background: #4a90d9;
      color: #fff;
    }
    .btn-primary:hover {
      background: #357abd;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }
    .server-list {
      list-style: none;
    }
    .server-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .server-item .name {
      font-weight: 600;
    }
    .server-item .status {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
    }
    .status-pending { background: #ffc107; color: #000; }
    .status-approved { background: #28a745; color: #fff; }
    .status-running { background: #17a2b8; color: #fff; }
    .status-stopped { background: #6c757d; color: #fff; }
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .alert-success { background: rgba(40,167,69,0.3); border: 1px solid #28a745; }
    .alert-error { background: rgba(220,53,69,0.3); border: 1px solid #dc3545; }
    .alert-info { background: rgba(23,162,184,0.3); border: 1px solid #17a2b8; }
    .loading {
      text-align: center;
      padding: 20px;
      color: #aaa;
    }
    .hidden { display: none; }
    .login-link {
      text-align: center;
      margin: 20px 0;
    }
    .login-link a {
      color: #4a90d9;
      text-decoration: none;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Mindustry 服务器申请</h1>

    <div id="loginSection" class="card">
      <h2>登录状态</h2>
      <div id="loginStatus" class="loading">检查登录状态...</div>
      <div id="loginPrompt" class="hidden">
        <div class="alert alert-info">
          请先登录 MindAuth 才能申请服务器
        </div>
        <div class="login-link">
          <a href="http://localhost:4001">前往 MindAuth 登录</a>
        </div>
      </div>
      <div id="userInfo" class="hidden">
        <p>已登录用户: <strong id="username"></strong></p>
        <button class="btn btn-secondary" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div id="myServersSection" class="card hidden">
      <h2>我的服务器</h2>
      <ul id="serverList" class="server-list">
        <li class="loading">加载中...</li>
      </ul>
    </div>

    <div id="applySection" class="card hidden">
      <h2>申请新服务器</h2>
      <div id="applyAlert" class="hidden"></div>
      <form id="applyForm" onsubmit="applyServer(event)">
        <div class="form-group">
          <label>服务器名称 *</label>
          <input type="text" id="serverName" required minlength="2" maxlength="50" placeholder="例如: 我的Mindustry服务器">
        </div>
        <div class="form-group">
          <label>服务器描述</label>
          <textarea id="serverDesc" placeholder="简单描述你的服务器用途"></textarea>
        </div>
        <div class="form-group">
          <label>服务器版本 *</label>
          <select id="serverVersion" required>
            <option value="">-- 选择版本 --</option>
          </select>
        </div>
        <div class="form-group">
          <label>使用模板</label>
          <select id="serverTemplate">
            <option value="">不使用模板</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">提交申请</button>
      </form>
    </div>

    <div id="publicServersSection" class="card">
      <h2>公开服务器列表</h2>
      <ul id="publicServerList" class="server-list">
        <li class="loading">加载中...</li>
      </ul>
    </div>
  </div>

  <script>
    const MINDAUTH_URL = 'http://localhost:4001';
    const MINDFOURM_URL = 'http://localhost:4000';

    let sessionToken = null;

    // 获取 session token
    function getToken() {
      const cookies = document.cookie.split(';');
      for (const c of cookies) {
        const [name, value] = c.trim().split('=');
        if (name === 'session') return value;
      }
      return null;
    }

    // 初始化
    async function init() {
      sessionToken = getToken();

      // 加载公开服务器
      loadPublicServers();

      // 加载版本和模板
      loadVersionsAndTemplates();

      if (!sessionToken) {
        showLoginPrompt();
        return;
      }

      // 验证登录状态
      try {
        const res = await fetch(`${MINDAUTH_URL}/api/me`, {
          headers: { 'Authorization': `Bearer ${sessionToken}` }
        });
        const data = await res.json();

        if (data.success) {
          showUserInfo(data);
          loadMyServers();
        } else {
          showLoginPrompt();
        }
      } catch (e) {
        showLoginPrompt();
      }
    }

    function showLoginPrompt() {
      document.getElementById('loginStatus').classList.add('hidden');
      document.getElementById('loginPrompt').classList.remove('hidden');
      document.getElementById('userInfo').classList.add('hidden');
      document.getElementById('myServersSection').classList.add('hidden');
      document.getElementById('applySection').classList.add('hidden');
    }

    function showUserInfo(data) {
      document.getElementById('loginStatus').classList.add('hidden');
      document.getElementById('loginPrompt').classList.add('hidden');
      document.getElementById('userInfo').classList.remove('hidden');
      document.getElementById('username').textContent = data.username;
      document.getElementById('myServersSection').classList.remove('hidden');
      document.getElementById('applySection').classList.remove('hidden');
    }

    async function loadMyServers() {
      const list = document.getElementById('serverList');
      list.innerHTML = '<li class="loading">加载中...</li>';

      try {
        const res = await fetch(`${MINDFOURM_URL}/api/servers/my`, {
          headers: { 'Authorization': `Bearer ${sessionToken}` }
        });
        const data = await res.json();

        if (data.success && data.data.servers.length > 0) {
          list.innerHTML = data.data.servers.map(s => `
            <li class="server-item">
              <div>
                <span class="name">${s.name}</span>
                <span style="color:#aaa;margin-left:10px;">v${s.version} | 端口: ${s.port}</span>
              </div>
              <span class="status status-${s.approval_status}">${getStatusLabel(s.approval_status)}</span>
            </li>
          `).join('');
        } else {
          list.innerHTML = '<li class="alert alert-info">暂无服务器，请申请一个新服务器</li>';
        }
      } catch (e) {
        list.innerHTML = '<li class="alert alert-error">加载失败</li>';
      }
    }

    async function loadPublicServers() {
      const list = document.getElementById('publicServerList');

      try {
        const res = await fetch(`${MINDFOURM_URL}/api/servers/public`);
        const data = await res.json();

        if (data.success && data.data.servers.length > 0) {
          list.innerHTML = data.data.servers.map(s => `
            <li class="server-item">
              <div>
                <span class="name">${s.name}</span>
                <span style="color:#aaa;margin-left:10px;">端口: ${s.port}</span>
              </div>
              <span class="status status-running">运行中</span>
            </li>
          `).join('');
        } else {
          list.innerHTML = '<li class="alert alert-info">暂无公开运行的服务器</li>';
        }
      } catch (e) {
        list.innerHTML = '<li class="alert alert-error">加载失败</li>';
      }
    }

    async function loadVersionsAndTemplates() {
      try {
        // 加载版本
        const vRes = await fetch(`${MINDFOURM_URL}/api/servers/versions`);
        const vData = await vRes.json();
        if (vData.success) {
          const select = document.getElementById('serverVersion');
          vData.data.versions.forEach(v => {
            select.innerHTML += `<option value="${v.version}">${v.version}${v.is_stable ? ' (稳定版)' : ''}</option>`;
          });
        }

        // 加载模板
        const tRes = await fetch(`${MINDFOURM_URL}/api/servers/templates`);
        const tData = await tRes.json();
        if (tData.success && tData.data.templates.length > 0) {
          const select = document.getElementById('serverTemplate');
          tData.data.templates.forEach(t => {
            select.innerHTML += `<option value="${t.id}">${t.name} (v${t.version})</option>`;
          });
        }
      } catch (e) {
        console.error('加载版本/模板失败', e);
      }
    }

    async function applyServer(e) {
      e.preventDefault();

      const name = document.getElementById('serverName').value;
      const description = document.getElementById('serverDesc').value;
      const version = document.getElementById('serverVersion').value;
      const template_id = document.getElementById('serverTemplate').value;

      const alert = document.getElementById('applyAlert');
      alert.className = 'hidden';

      try {
        const res = await fetch(`${MINDFOURM_URL}/api/servers/apply`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${sessionToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name,
            description,
            version,
            template_id: template_id || null
          })
        });
        const data = await res.json();

        if (data.success) {
          alert.className = 'alert alert-success';
          alert.textContent = `申请成功! 服务器ID: ${data.data.server_id}。等待管理员审批。`;
          document.getElementById('applyForm').reset();
          loadMyServers();
        } else {
          alert.className = 'alert alert-error';
          alert.textContent = data.message || '申请失败';
        }
      } catch (e) {
        alert.className = 'alert alert-error';
        alert.textContent = '网络错误，请稍后重试';
      }
    }

    function getStatusLabel(status) {
      const labels = {
        pending: '待审批',
        approved: '已批准',
        rejected: '已拒绝',
        running: '运行中',
        stopped: '已停止'
      };
      return labels[status] || status;
    }

    function logout() {
      document.cookie = 'session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
      location.reload();
    }

    init();
  </script>
</body>
</html>
