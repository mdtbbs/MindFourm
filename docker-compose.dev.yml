version: '3.8'

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mindforum
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/database/migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: mindforum
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:3000
      MINDAUTH_URL: http://localhost:4001
      MINDAUTH_CLIENT_ID: forum
      MINDAUTH_CLIENT_SECRET: ${MINDAUTH_CLIENT_SECRET:-dev-secret}
    depends_on:
      - mysql
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_MINDAUTH_URL: http://localhost:4001
        NEXT_PUBLIC_MINDAUTH_CLIENT_ID: forum
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_MINDAUTH_URL: http://localhost:4001
      NEXT_PUBLIC_MINDAUTH_CLIENT_ID: forum
    depends_on:
      - backend

volumes:
  mysql_data:
